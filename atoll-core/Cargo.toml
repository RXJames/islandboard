[package]
name = "atoll-core"
version = "0.1.0"
edition = "2021"
description = "Rust data layer for Atoll: streaming JSONL usage aggregation (Claude Code / Codex session logs)"
license = "GPL-3.0-or-later"

[lib]
name = "atoll_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
